name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  restore-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore src/html.ts if it was overwritten
        run: |
          set -euo pipefail
          bytes=$(wc -c < src/html.ts)
          echo "src/html.ts is ${bytes} bytes"
          if [ "$bytes" -lt 1000 ]; then
            echo "Restoring src/html.ts from 8780942e8c9a54a3f8d0aab83183e467de9441d7"
            git checkout 8780942e8c9a54a3f8d0aab83183e467de9441d7 -- src/html.ts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/html.ts
            git commit -m "Restore src/html.ts from last good commit"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Skipping wrangler deploy."
            echo "Add a Cloudflare API token secret named CLOUDFLARE_API_TOKEN, then re-run this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            export CLOUDFLARE_ACCOUNT_ID=9a80a76ea36cdd56412e84794cbeddca
          fi
          npx wrangler deploy
